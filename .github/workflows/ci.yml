name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Resolve packages
        run: swift package resolve

      - name: Build (arm64)
        run: swift build --arch arm64

      - name: Build (x86_64)
        run: swift build --arch x86_64

      - name: Test
        run: swift test

      - name: Validate plists
        run: |
          plutil -lint Resources/Info.plist Resources/Wijeti.entitlements
          bash -n Scripts/build-app.sh Scripts/build-runtime.sh Scripts/make-dmg.sh Scripts/make-appcast.sh Scripts/release.sh Scripts/verify-release.sh
